apiVersion: apps/v1
kind: Deployment
metadata:
  # .Release.Name injects the name you pass to helm install
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  # Pulls from values.yaml so users can scale with --set replicaCount=3
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5000
              name: http
          # toYaml converts the nested resources object from values.yaml into proper YAML
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5