apiVersion: apps/v1
kind: Deployment
metadata:
  name: fittrack
  namespace: fittrack
  labels:
    app: fittrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fittrack
  template:
    metadata:
      labels:
        app: fittrack
    spec:
      containers:
        - name: fittrack
          image: ahmed3015/fittrack:latest
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
